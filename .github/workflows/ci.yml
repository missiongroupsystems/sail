name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, test, contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit, property and reference-set tests (shared)
        run: pnpm --filter @sail/shared test
        env:
          SAIL_REFERENCE_MIN: "60"
      - name: Server tests on embedded Postgres (RLS replay, pipeline, SSE)
        run: pnpm --filter @sail/server test
      - name: Relay tests
        run: pnpm --filter @sail/relay test
      - name: OpenAPI contract is committed and reviewed
        run: pnpm --filter @sail/server openapi:check
      - name: MCP tool manifest matches the routes
        run: pnpm --filter @sail/server manifest:check
      - name: Migration drift (schema changes need a generated migration)
        run: |
          pnpm --filter @sail/server exec drizzle-kit generate --name ci_drift_check
          if git status --porcelain packages/server/drizzle | grep -q .; then
            echo "Schema differs from migrations. Run pnpm db:generate and commit the result."; git status --porcelain packages/server/drizzle; exit 1
          fi
      - name: No other POS named in the repo
        run: |
          if [ -n "$TERMS" ]; then printf '%s\n' "$TERMS" > "$RUNNER_TEMP/forbidden.txt"; export SAIL_FORBIDDEN_TERMS_FILE="$RUNNER_TEMP/forbidden.txt"; fi
          pnpm check:no-other-pos
        env:
          TERMS: ${{ secrets.SAIL_FORBIDDEN_TERMS_FILE }}
      - name: Build server image artefact
        run: pnpm --filter @sail/server build
      - name: Build web
        run: pnpm --filter @sail/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @sail/e2e exec playwright install --with-deps chromium
      - name: Back office, POS and guest app in a browser
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: packages/e2e/test-results
          retention-days: 7

  # Staging: on merge to main, migrate the staging database (Supabase branch), then deploy the staging Fly app.
  # Prod: manual approval through the `production` environment, then migrate, deploy and poll /health.
  # Both jobs need secrets that are not configured yet, so they run only when DEPLOY_ENABLED is true.
  deploy-staging:
    name: Migrate and deploy staging
    needs: test
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate staging (drift check, migrate, drift check)
        run: pnpm --filter @sail/server db:migrate
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy staging API
        run: flyctl deploy --config packages/server/fly.staging.toml --remote-only --build-arg SAIL_VERSION=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Poll /health
        run: for i in $(seq 1 30); do curl -fsS "https://${{ vars.STAGING_API_HOST }}/health" && exit 0; sleep 5; done; exit 1

  deploy-prod:
    name: Migrate and deploy production (manual approval)
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate production
        run: pnpm --filter @sail/server db:migrate
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy production API
        run: flyctl deploy --config packages/server/fly.toml --remote-only --build-arg SAIL_VERSION=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Poll /health
        run: for i in $(seq 1 30); do curl -fsS "https://${{ vars.PROD_API_HOST }}/health" && exit 0; sleep 5; done; exit 1
