# Staging API (Fly.io, Singapore): deployed on every merge to main, after migrating the staging database.
app = "sail-api-staging"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "debug"
  DB_POOL_MAX = "6"
  TX_MAX = "4"
  QUEUE_MAX = "32"

[processes]
  app = "node dist/index.js --role=app"
  worker = "node dist/index.js --role=worker"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 100
    hard_limit = 200
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "256mb"
